<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
</head>
<style>
    table, th, td{
        border: 1px solid black;
        border-collapse: collapse;
        padding: 6px;
        background-color: aquamarine;
        text-align: center;
    }
    th{
        background-color:rgb(73, 219, 255);
    }
    caption{
        border: 1px solid black;
        border-collapse: collapse;
        padding: 6px;
        background-color: rgb(7, 102, 146);
        font-size: large;
    }
</style>
<body>
    <table>
        <caption>
            <b>Time Table</b>
        </caption>
        <thead>
            <th>Days</th>
            <th>8:00 to 9:00</th>
            <th>9:00 to 10:00</th>
            <th>10:00 to 11:00</th>
            <th>11:00 to 12:00</th>
            <th>12:00 to 1:00</th>
        </thead>
        <tbody>
            <tr>
                <th>Monday</th>
                <td>Urdu</td>
                <td>English</td>
                <td>Chemistry</td>
                <td rowspan="4" style="text-align: center;">Break</td>
                <td>Physics</td>
            </tr>
            <tr>
                <th>Tuesday</th>
                <td>English</td>
                <td>Chemistry</td>
                <td>Physics</td>
                <!-- <td>Break</td> -->
                <td>Urdu</td>
            </tr>
            <tr>
                <th>Wednesday</th>
                <td rowspan="3" style="text-align: center;">Chemistry</td>
                <td>Physics</td>
                <td>Urdu</td>
                <!-- <td>Break</td> -->
                <td>English</td>
            </tr>
            <tr>
                <th>Thursday</th>
                <!-- <td>Chemistry</td> -->
                <td>Urdu</td>
                <td>English</td>
                <!-- <td>Break</td> -->
                <td>Physics</td>
            </tr>
            <tr>
                <th>Friday</th>
                <!-- <td>Chemistry</td> -->
                <td colspan="2" style="text-align: center;">Lab</td>
                <td colspan="2"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
