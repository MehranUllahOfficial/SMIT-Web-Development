<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!-- Tables are used to organize data -->
    <!-- Caption use for title of table -->
    <h1>HTML Table</h1>
    <table>
        <thead>
            <th>Company Name</th>
            <th>Contact</th>
            <th>Country</th>
        </thead>
        <tbody>
            <tr>
                <td>Facebook</td>
                <td>facebook help</td>
                <td>UK</td>
            </tr>
            <tr>
                <td>YouTube</td>
                <td>youtube help</td>
                <td>US</td>
            </tr>
            <tr>
                <td>Google</td>
                <td>google help</td>
                <td>UAE</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
