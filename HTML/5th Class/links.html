<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link</title>
</head>
<body>
    <!-- Links -->
    <!-- Absolute Links-> Refrence to external links not our own website pagelink -->
    <!-- Relative Links-> Refrence to internal links -->
    <!-- a->Anhor tag -->
    <!-- a attributes. 1. href->Links inside -->
    <a href="https://www.google.com/">Google</a>
    <br>
    <!-- a attributes. 2. target->Links open where? in same ordifferent tab -->
     <!-- _blank open in new tab -->
    <!-- Absolute -->
    <a href="https://www.westernunion.com/pk/en/home.html" target="_blank">Western Union</a>
    <br>
    <!-- _self-> open in same tab by diffault -->
    <a href="https://www.w3schools.com/tags/att_a_target.asp" target="_self">HTML Target</a>
    <br>

    <!-- Relative -->
     <!-- File are same folder than just name of the file in href to link -->
    <a href="lists.html">List Page</a>
    <br>

    <a href="example/exp.html">Example Page</a>
    <br>
    <a href="example/subexp/subexp.html">Sub Page</a>
    
</body>
</html>
