<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <!-- Radio Button: Select only 1 option -->
    <!-- Checkboxe: Can select multiple options -->
    <h1>HTML FORM</h1>
    <form action="">
        <label for="email">Email:</label> <br>
        <input type="email" id="email" placeholder="example@gmail.com" required> <br>
        <label for="pass">Password:</label> <br>
        <input type="password" id="pass" required> <br>

        <label for="">FeedBack</label> <br>
        <textarea name="" id="" cols="50" rows="10"></textarea> <br>
        <input type="submit" value="Login">
    </form>
    
</body>
</html>
