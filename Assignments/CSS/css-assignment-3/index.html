<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="form-container">
        <div class="contact-wrap">
            <h1>Send Us a Message</h1>
            <form action="">
                <label for="name">Full Name</label>
                <input class="input1" type="text" id="name" placeholder="Full Name" required>
                <label for="email">E-mail</label>
                <input class="input1" type="email" id="email" placeholder="E-mail" required>
                <label for="phone">Phone</label>
                <input class="input1" type="tel" id="phone" placeholder="Phone" required>
                <label for="txt-area">Your Message</label>
                <textarea class="input1" name="text-area" id="txt-area" required rows="10" placeholder="Your Message"></textarea>
                <button type="submit" style="width: 25%;">SEND</button>
            </form>
        </div>
    </div>
</body>
</html>
