<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units in CSS</title>
    <style>
        /* Units in CSS */
        /* 2 types */
        /* Absolute: px, cm etc (Independent | fixed)*/
        /* Relative: rem, em (mostly use for font), %, viewport: vw, vh(use for size) (Dependent)*/
        /* Height cannot be 100 percentage so always use vh-> view height and vwwith width which is view width */
        /* Initial Screen/View we see called Viewport */
        /* Default font size 16px */
        /* rem: root element: work with root element(HTML). 1rem = 16px default*/
        /* em: element: work with parent */
        .container{
            border: 1px solid;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="para">Lorem ipsum dolor sit amet.</p>
    </div>
</body>
</html>
